name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --upgrade pip
      - run: pip install ruff
      - run: ruff check --output-format=github .

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lexbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxmlsec1-dev libxml2-dev pkg-config && sudo rm -rf /var/lib/apt/lists/*
      - run: pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio httpx
      - run: cp .env.example .env
      - name: Wait for PostgreSQL
        run: |
          DB_READY=false
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432; then
              echo "PostgreSQL ready after ${i}s"
              DB_READY=true
              break
            fi
            echo "Waiting for Postgres ($i/30)..."
            sleep 2
          done
          if [ "$DB_READY" != "true" ]; then
            echo "::error::PostgreSQL did not become ready within 60 seconds"
            exit 1
          fi
      - name: Run Database Migrations
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/lexbot_test"
        run: alembic upgrade head
      - name: List installed packages
        run: pip list 2>&1 | head -40
      - name: Run Backend Tests
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/lexbot_test"
        run: pytest tests/ -v --tb=short -x

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npx eslint .

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run build
      - run: npx vitest run --reporter=verbose
        continue-on-error: true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lexbot-backend -f Dockerfile.backend .
      - run: docker build -t lexbot-frontend -f frontend/Dockerfile frontend/
