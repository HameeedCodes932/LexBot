services:
  - type: web
    name: lexbot-backend
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      pip install torch --index-url https://download.pytorch.org/whl/cpu
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lexbot-db
          property: connectionString
      - key: SUPABASE_URL
        value: ""  # set manually in Render dashboard
      - key: SUPABASE_KEY
        value: ""  # set manually in Render dashboard
      - key: SUPABASE_STORAGE_BUCKET
        value: lexbot-uploads
      - key: GROQ_API_KEY
        value: ""  # set manually
      - key: OPENAI_API_KEY
        value: ""  # set manually
      - key: ANTHROPIC_API_KEY
        value: ""  # set manually
      - key: GOOGLE_API_KEY
        value: ""  # set manually
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://lexbot-frontend.vercel.app"
      - key: DEFAULT_LLM_PROVIDER
        value: groq
      - key: ENABLE_MULTILINGUAL
        value: "true"
      - key: ENABLE_VOICE
        value: "true"
      # Python version set via runtime.txt

databases:
  - name: lexbot-db
    plan: free
    databaseName: lexbot
    user: lexbot
